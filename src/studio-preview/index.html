<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717"><meta name="resource-base" content="https://ink-armory-aisaka-1010.cater-dcy.chatgpt.site/">
<title>摄影棚 · 奇迹鱿鱿</title><link rel="icon" href="../assets/site-icon.ico"><link rel="stylesheet" href="./studio.css">
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.min.js"}}</script>
</head><body>
<header><a id="back" href="./customizer.html?game=spl3">‹ 返回搭配</a><h1>摄影棚</h1><span class="space"></span><button id="projects">项目</button><button class="primary" id="export" disabled>导出壁纸</button></header>
<main>
<section class="stage" aria-label="壁纸预览"><div class="frame" id="frame"><canvas id="view" aria-label="场景预览，拖动旋转，双指或滚轮缩放"></canvas><div class="lock" id="lock" hidden aria-hidden="true"><span id="date"></span><strong>09:41</strong></div></div>
<div class="stagebar"><button id="fit">适配全景</button><button id="move" aria-pressed="false">拖动摆放</button><button id="full" aria-pressed="false">全屏预览</button></div></section>
<aside><div class="panel-tabs" aria-label="摄影棚设置"><button data-pane="cast" aria-pressed="true">场景</button><button data-pane="frame-settings" aria-pressed="false">画面</button><button data-pane="lighting" aria-pressed="false">灯光</button></div>
<section id="cast" class="pane">
<div class="line"><label for="actors">场景成员</label><select id="actors"></select><button id="add" aria-label="添加角色或道具">＋</button></div>
<div class="line"><button id="dress">编辑搭配</button><button id="save-look">收藏搭配</button><button id="remove">移出场景</button></div>
<label class="field" id="pose-row">动作<select id="pose"></select></label>
<fieldset><legend>摆放</legend><div id="transforms"></div></fieldset>
</section>
<section id="frame-settings" class="pane" hidden>
<label class="field">取景<select id="framing"><option value="all">全景</option><option value="half">选中角色 · 半身</option><option value="portrait">选中角色 · 特写</option></select></label>
<label class="field">画幅<select id="size"><option value="1206x2622">iPhone · 1206 × 2622</option><option value="1080x1920">手机 · 9:16</option><option value="2048x2732">iPad · 3:4</option><option value="1920x1080">桌面 · 16:9</option><option value="1600x1600">方形 · 1:1</option><option value="custom">自定义</option></select></label>
<div class="line" id="custom-size" hidden><label>宽 <input id="width" type="number" min="64" max="8192"></label><label>高 <input id="height" type="number" min="64" max="8192"></label></div>
<div class="line"><button id="rotate">交换宽高</button><label class="check"><input id="clock" type="checkbox">锁屏预览</label></div>
<label class="field" id="clock-row" hidden>时钟高度<input id="clock-height" type="range" min="75" max="150" step="1"></label>
<label class="field">背景<select id="background"><option value="gradient">渐变</option><option value="solid">纯色</option><option value="dots">墨点</option><option value="photo">照片</option><option value="transparent">透明</option></select></label>
<div class="line"><label id="first-row">底色 <input type="color" id="first-color"></label><label id="second-row">配色 <input type="color" id="second-color"></label></div>
<label class="field" id="photo-row" hidden>上传照片<input type="file" id="photo" accept="image/*"></label>
<label class="field">导出倍率<select id="scale"><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
<label class="field">渲染精度<select id="quality"><option value="1">标准</option><option value="1.5">高</option><option value="2">超采样 2×</option></select></label>
<label class="field">格式<select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></label>
</section>
<section id="lighting" class="pane" hidden><label class="field">预设<select id="light"><option value="studio">摄影棚</option><option value="soft">柔光</option><option value="sunset">日落</option><option value="night">夜景</option><option value="custom" hidden>自定义</option></select></label><div id="lights"></div><label class="check"><input id="shadow" type="checkbox">地面投影</label><label class="field">灯光颜色<input id="light-color" type="color"></label></section>
<p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>重试加载</button></aside>
</main>
<dialog id="project-dialog"><div class="dialog-head"><h2>项目</h2><button data-close>关闭</button></div><label class="field">当前项目<select id="project-list"></select></label><label class="field">项目名称<input id="project-name" maxlength="64"></label><div class="line"><button id="rename">重命名</button><button id="duplicate">复制</button><button id="new">新建</button><button id="delete">删除</button></div></dialog>
<dialog id="add-dialog"><div class="dialog-head"><h2>加入场景</h2><button data-close>关闭</button></div><div class="line"><button data-character="spl3">＋ 喷 3 角色</button><button data-character="raiders">＋ 涂击队角色</button></div><div id="looks"></div>
<fieldset><legend>模型库</legend><div class="line"><select id="lib-game" aria-label="游戏"><option value="spl3">喷 3</option><option value="raiders">涂击队</option><option value="phantom">幻界</option></select><select id="lib-section" aria-label="模型类别"></select></div><input id="search" type="search" placeholder="搜索模型" aria-label="搜索模型"><div id="results"></div><button id="more" hidden>更多模型</button></fieldset></dialog>
<dialog id="result-dialog"><div class="dialog-head"><h2>壁纸已生成</h2><button data-close>完成</button></div><img id="result-image" alt="导出的壁纸"><p id="result-size"></p><div class="line"><a id="save-image" class="primary">保存图片</a><button id="share-image" hidden>分享</button></div></dialog>
<script type="module" src="./studio.js"></script></body></html>
