<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101010">
<title>按钮动效试玩 · 奇迹鱿鱿</title>
<link rel="icon" href="../assets/site-icon.ico">
<style>
:root {color-scheme:dark;--orange:#ff6122;--paper:#f1efec;font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
* {box-sizing:border-box}
body {margin:0;background:#101010;color:var(--paper)}
button,input {font:inherit}
button {cursor:pointer;color:inherit;border:0}
button:disabled {cursor:default}
button:focus-visible,input:focus-visible + span {outline:2px solid #ff995d;outline-offset:4px}
main {width:min(720px,100%);margin:clamp(30px,9vh,92px) auto 40px;padding:0 clamp(14px,4vw,32px)}
h1 {font-size:clamp(26px,5vw,38px);letter-spacing:-.04em;margin:0 0 22px}
fieldset {margin:0 0 12px;padding:4px;border:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#232323;border-radius:12px}
label {position:relative;cursor:pointer}
label input,.sr {position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
label span {display:flex;align-items:baseline;justify-content:center;gap:8px;border-radius:8px;padding:11px 3px;color:#c9c5c2;font-weight:600;font-size:clamp(13px,2.8vw,16px)}
label b {font-size:.78em;font-family:ui-monospace,monospace;font-weight:650;color:#a5a09b}
label input:checked + span {background:var(--paper);color:#161616}
label input:checked + span b {color:#68574b}
.stage {display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;border-radius:16px;min-height:clamp(310px,48vh,420px);padding:40px clamp(12px,3vw,24px);background-color:#151515;background-image:radial-gradient(#303030 1px,transparent 1px);background-size:13px 13px}
.notice {width:min(390px,100%);padding:clamp(18px,4vw,30px);background:#202020;border-radius:16px;box-shadow:0 12px 36px #0005}
.notice h2 {font-size:15px;font-weight:500;color:#c1c1c1;margin:0 0 12px}
.author {display:flex;align-items:center;gap:12px}
.author img {display:block;width:48px;height:48px;border-radius:50%}
.author small {display:block;font-size:13px;color:#c1c1c1}
.author strong {font-size:clamp(20px,4vw,26px);line-height:1.35;text-decoration:underline;text-decoration-color:#888;text-underline-offset:.16em;text-decoration-thickness:1px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px}
.refusal-slot {position:relative}
.actions button,.face,.reopen {min-height:44px;border-radius:8px;font-size:14px}
.refuse {width:100%;position:relative;display:block;padding:0;background:transparent;touch-action:manipulation}
.face,.shard {display:grid;place-items:center;color:#fafafa;background:#363636;border:1px solid #f2f2f2;font-weight:500}
.face {width:100%;pointer-events:none}
.accept,.reopen {background:var(--orange);color:#111;font-weight:700;padding:9px 14px}
.accept:hover,.reopen:hover {background:#ff8047}
.origin {position:absolute;z-index:2;top:50%;left:50%;width:0;height:0;pointer-events:none}
.piece,.shard {position:absolute;display:block;pointer-events:none;will-change:transform,opacity}
.shard {display:grid;border-radius:8px;line-height:1;font-size:14px}
.ring {border:2px solid currentColor;border-radius:50%}
.ink {background:currentColor;border-radius:56% 44% 64% 36% / 45% 58% 42% 55%}
.drop {background:currentColor;border-radius:85% 35% 40% 65% / 55% 50% 50% 45%}
.streak {background:currentColor;clip-path:polygon(0 45%,100% 0,81% 62%,5% 100%)}
.spark {background:currentColor;clip-path:polygon(50% 0,61% 36%,100% 49%,62% 60%,49% 100%,39% 64%,0 51%,37% 39%)}
.flare {background:currentColor;clip-path:polygon(50% 0,56% 33%,76% 6%,69% 37%,100% 20%,76% 46%,99% 53%,72% 59%,93% 92%,61% 71%,53% 100%,47% 72%,26% 96%,35% 67%,0 81%,27% 55%,2% 44%,32% 42%,13% 9%,41% 33%)}
.halftone {border-radius:50%;background-image:radial-gradient(currentColor 1.3px,transparent 1.6px);background-size:5px 5px}
.crack {background:#fff2d8;clip-path:polygon(42% 0,53% 0,39% 35%,60% 47%,46% 100%,48% 53%,30% 42%)}
.controls {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 1px;color:#c4c0bd;font-size:14px}
.replay {display:inline-flex;align-items:center;gap:6px;background:transparent;padding:10px 6px;min-height:44px}
.replay svg {width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
[hidden] {display:none!important}
@media(max-width:370px){label span{gap:3px}.stage{padding-inline:9px}.notice{padding:18px 14px}}
</style>
</head>
<body>
<main>
<h1>按钮动效试玩</h1>
<fieldset><legend class="sr">选择动效</legend>
<label><input type="radio" name="effect" value="ink" checked><span><b>A</b>墨汁爆裂</span></label>
<label><input type="radio" name="effect" value="shards"><span><b>B</b>边框击碎</span></label>
<label><input type="radio" name="effect" value="comic"><span><b>C</b>漫画重击</span></label>
</fieldset>
<section class="stage" aria-label="动效预览">
<div class="notice">
<h2>使用请标明作者：</h2>
<div class="author"><img src="../assets/credit-avatar.jpg" alt=""><div><small>小红书</small><strong>@喝猫撸奶茶</strong></div></div>
<div class="actions">
<div class="refusal-slot"><button class="refuse" type="button"><span class="face">不行！</span></button><div class="origin" aria-hidden="true"></div></div>
<button class="accept" type="button">收到！</button>
</div></div>
<button class="reopen" type="button" hidden>重新打开弹窗</button>
</section>
<div class="controls"><span role="status">点三下「不行！」试试</span><button class="replay" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 9a8 8 0 1 1 0 6M5 3v6h6"/></svg>重玩</button></div>
</main>
<script>
const q = selector => document.querySelector(selector);
const radios = [...document.querySelectorAll('input[name="effect"]')];
const notice = q('.notice'), origin = q('.origin'), face = q('.face');
const refuse = q('.refuse'), accept = q('.accept'), reopen = q('.reopen'), status = q('[role="status"]');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const orange = '#ff6122', cream = '#fff3d5', amber = '#ffac37';
const TAU = Math.PI * 2;
const random = (min,max) => min + Math.random() * (max-min);
let mode = 'ink', hits = 0, run = 0, recoil;

function animatePiece(node, frames, duration, delay = 0) {
  origin.append(node);
  const animation = node.animate(frames, {duration,delay,fill:'both'});
  animation.onfinish = () => node.remove();
}
function piece(shape,x,y,w,h,color) {
  const el = document.createElement('i');
  el.className = 'piece ' + shape;
  Object.assign(el.style,{left:x-w/2+'px',top:y-h/2+'px',width:w+'px',height:h+'px',color});
  return el;
}
function pulse(shape,x,y,w,h,color,duration,angle=0,delay=0) {
  const el = piece(shape,x,y,w,h,color);
  const turn = 'rotate('+angle+'deg) ';
  animatePiece(el, [
    {transform:turn+'scale(.15)',opacity:1,easing:'cubic-bezier(.15,.75,.25,1)'},
    {transform:turn+'scale(.88)',opacity:1,offset:.38},
    {transform:turn+'scale(1.14)',opacity:0}
  ],duration,delay);
}
function spray(shape,count,distance,color,options={}) {
  const {x=0,y=0,size=5,stretch=1,gravity=0,start=0,life=420,delay=0} = options;
  for(let i=0;i<count;i++) {
    const angle = (i+random(-.28,.28))*TAU/count;
    const length = distance*random(.52,1.12), radius = size*random(.58,1.3);
    const dx = Math.cos(angle)*length, dy = Math.sin(angle)*length;
    const el = piece(shape,x+Math.cos(angle)*start,y+Math.sin(angle)*start,radius*stretch,radius,color);
    const rot = angle*180/Math.PI;
    const pose = (tx,ty,s) => 'translate('+tx+'px,'+ty+'px) rotate('+rot+'deg) scale('+s+')';
    animatePiece(el, [
      {transform:pose(0,0,.45),opacity:0},
      {transform:pose(dx*.34,dy*.34,1),opacity:1,offset:.12},
      {transform:pose(dx*.86,dy*.86+gravity*.3,.85),opacity:1,offset:.55},
      {transform:pose(dx,dy+gravity,.25),opacity:0}
    ],life*random(.78,1.18),delay+random(0,22));
  }
}
function inkBurst() {
  pulse('ink',0,0,74,52,orange,480,-14);
  pulse('ink',-10,-3,34,19,amber,270,-18,18);
  pulse('ring',0,0,108,70,cream,215,-16);
  spray('drop',12,66,orange,{size:9,stretch:1.65,gravity:24,life:520});
  spray('ink',15,91,amber,{size:4.5,gravity:29,life:640,delay:32});
}
function shatter() {
  // Clip matching copies of the actual button so the outlines and letters break along with it.
  const w = face.offsetWidth, h = face.offsetHeight, scale = .6, columns = 4;
  const rows = [0,.52,1].map((row,r)=>Array.from({length:columns+1},(_,c)=>[
    c===0||c===columns?c/columns:(c+random(-.2,.2))/columns,
    r===1?row+random(-.15,.15):row
  ]));
  function triangle(points) {
    const px=points.reduce((s,p)=>s+p[0],0)/3, py=points.reduce((s,p)=>s+p[1],0)/3;
    const cx=(px-.5)*w, cy=(py-.5)*h, angle=Math.atan2(cy*2,cx)+random(-.43,.43);
    const dx=Math.cos(angle)*random(32,78), dy=Math.sin(angle)*random(27,60)-15;
    const spin=random(-130,130), el=document.createElement('span');
    el.className='shard'; el.textContent=face.textContent;
    Object.assign(el.style,{left:-w/2+'px',top:-h/2+'px',width:w+'px',height:h+'px',
      transformOrigin:(px*100)+'% '+(py*100)+'%',clipPath:'polygon('+points.map(p=>p[0]*100+'% '+p[1]*100+'%').join(',')+')'});
    const pose=(x,y,a,s)=>'translate('+((scale-1)*cx+x)+'px,'+((scale-1)*cy+y)+'px) rotate('+a+'deg) scale('+s+')';
    animatePiece(el,[
      {transform:pose(0,0,0,scale),opacity:1},
      {transform:pose(dx*.8,dy*.85,spin*.45,scale),opacity:1,offset:.42},
      {transform:pose(dx,dy+42,spin,.19),opacity:0}
    ],random(410,620));
  }
  for(let r=0;r<2;r++)for(let c=0;c<columns;c++){
    const a=rows[r][c],b=rows[r][c+1],d=rows[r+1][c],e=rows[r+1][c+1];
    if((c+r)%2){triangle([a,b,d]);triangle([b,e,d]);}
    else {triangle([a,b,e]);triangle([a,e,d]);}
  }
  pulse('ring',0,0,95,66,'#efefef',200,-9);
  spray('streak',9,78,cream,{size:2.4,stretch:5,life:290});
}
function comicBurst() {
  pulse('halftone',-6,3,129,91,orange,480,0,48);
  pulse('flare',0,0,134,92,orange,350,-14);
  pulse('flare',0,0,92,68,cream,220,8);
  pulse('spark',-4,0,45,42,'#141414',165,-7);
  spray('streak',17,104,cream,{size:3.5,stretch:7,start:22,life:320});
  spray('spark',6,81,amber,{size:10,life:450,delay:55});
}
const bursts = {ink:inkBurst,shards:shatter,comic:comicBurst};
function hitAccent(x,y,n) {
  if(mode==='ink') {
    pulse('ink',x,y,20+n*6,9+n*3,amber,185,-18);
    spray('drop',3+n,16+7*n,orange,{x,y,size:3,stretch:1.5,gravity:8,life:230});
  } else if(mode==='shards') {
    pulse('crack',x,y,24+n*5,20+n*3,cream,225,-12);
    spray('streak',3+n,18+6*n,cream,{x,y,size:1.7,stretch:4,life:180});
  } else {
    pulse('spark',x,y,24+n*7,20+n*4,cream,145,-10);
    spray('streak',4+n,23+7*n,orange,{x,y,size:2,stretch:4.5,life:190});
  }
}
const transform = (sx,sy,x=0,y=0,deg=0) =>
  'translate('+x+'px,'+y+'px) rotate('+deg+'deg) scale('+sx+','+sy+')';
function reset() {
  run++;
  recoil?.cancel(); recoil=null;
  origin.replaceChildren();
  hits=0;refuse.disabled=false;face.style.transform='none';face.style.opacity='1';
  notice.hidden=false;reopen.hidden=true;status.textContent='点三下「不行！」试试';
}
async function hit(event) {
  if(hits>=3 || notice.hidden) return;
  const n=++hits, final=n===3, token=run, target=1-.2*n;
  const box=refuse.getBoundingClientRect();
  const x=event.detail?Math.max(-box.width*.28,Math.min(box.width*.28,event.clientX-box.left-box.width/2)):0;
  const y=event.detail?Math.max(-8,Math.min(8,event.clientY-box.top-box.height/2)):0;
  const dir=x<0?1:-1;
  const current=getComputedStyle(face).transform;
  recoil?.cancel();
  if(final) {
    if(document.activeElement===refuse) accept.focus({preventScroll:true});
    refuse.disabled=true;
  }
  status.textContent=n+' / 3'+(final?' · 可点「重玩」':'');
  const resting=final?'scale(0)':'scale('+target+')';
  face.style.transform=resting;
  if(reducedMotion.matches) {
    if(final) face.style.opacity='0';
    return;
  }
  if(!final) hitAccent(x,y,n);
  const prev=1-.2*(n-1);
  let contact, overshoot;
  if(mode==='ink'){
    contact=transform(prev*1.14,prev*.58,0,3);
    overshoot=transform(target*.88,target*1.16,0,-2);
  }else if(mode==='shards'){
    contact=transform(prev*.94,prev*.91,dir*(4+n),1,dir*2);
    overshoot=transform(target,target,-dir*2,0,-dir*1.5);
  }else{
    contact=transform(prev*1.05,prev*.77,dir*5,2,dir*(3+n));
    overshoot=transform(target*.98,target*1.09,-dir*2,-2,-dir*2);
  }
  const frames=final?[
    {transform:current},{transform:contact,offset:.27},{transform:contact,offset:.82},
    {transform:mode==='shards'?'scale(.6)':'scale(.13)'}
  ]:[
    {transform:current},{transform:contact,offset:.15},{transform:contact,offset:.31},
    {transform:overshoot,offset:.59,easing:'ease-out'},{transform:resting}
  ];
  recoil=face.animate(frames,{duration:final?115:(mode==='shards'?185:245),fill:'none'});
  try {await recoil.finished;} catch {return;}
  if(final && token===run && !notice.hidden){
    face.style.opacity='0';
    bursts[mode]();
  }
}
refuse.addEventListener('click',hit);
accept.addEventListener('click',()=>{
  reset(); notice.hidden=true; reopen.hidden=false; status.textContent='弹窗已关闭';reopen.focus({preventScroll:true});
});
reopen.addEventListener('click',()=>{reset();refuse.focus({preventScroll:true});});
q('.replay').addEventListener('click',reset);
function choose(value) {
  const radio=radios.find(input=>input.value===value)||radios[0];
  radio.checked=true;mode=radio.value;reset();
}
radios.forEach(input=>input.addEventListener('change',()=>{choose(input.value);history.replaceState(null,'','#'+mode);}));
window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));
choose(location.hash.slice(1));
</script>
</body>
</html>
