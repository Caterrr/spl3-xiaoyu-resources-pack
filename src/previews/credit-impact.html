<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101010">
<title>粒子动效试玩 · 奇迹鱿鱿</title>
<link rel="icon" href="../assets/site-icon.ico">
<style>
:root {color-scheme:dark;--orange:#ff6122;--paper:#f1efec;font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
* {box-sizing:border-box}
body {margin:0;background:#101010;color:var(--paper)}
button,input {font:inherit}
button {cursor:pointer;color:inherit;border:0}
button:disabled {cursor:default}
button:focus-visible,input:focus-visible + span {outline:2px solid #ff995d;outline-offset:4px}
main {width:min(720px,100%);margin:clamp(30px,9vh,92px) auto 40px;padding:0 clamp(14px,4vw,32px)}
h1 {font-size:clamp(26px,5vw,38px);letter-spacing:-.04em;margin:0 0 22px}
fieldset {margin:0 0 12px;padding:4px;border:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#232323;border-radius:12px}
label {position:relative;cursor:pointer}
label input,.sr {position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
label span {display:flex;align-items:baseline;justify-content:center;gap:8px;border-radius:8px;padding:11px 3px;color:#c9c5c2;font-weight:600;font-size:clamp(13px,2.8vw,16px)}
label b {font-size:.78em;font-family:ui-monospace,monospace;font-weight:650;color:#a5a09b}
label input:checked + span {background:var(--paper);color:#161616}
label input:checked + span b {color:#68574b}
.stage {display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;border-radius:16px;min-height:clamp(310px,48vh,420px);padding:40px clamp(12px,3vw,24px);background:#151515}
.notice {width:min(390px,100%);padding:clamp(18px,4vw,30px);background:#202020;border-radius:16px;box-shadow:0 12px 36px #0005}
.notice h2 {font-size:15px;font-weight:500;color:#c1c1c1;margin:0 0 12px}
.author {display:flex;align-items:center;gap:12px}
.author img {display:block;width:48px;height:48px;border-radius:50%}
.author small {display:block;font-size:13px;color:#c1c1c1}
.author strong {font-size:clamp(20px,4vw,26px);line-height:1.35;text-decoration:underline;text-decoration-color:#888;text-underline-offset:.16em;text-decoration-thickness:1px}
.actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px}
.refusal-slot {position:relative}
.actions button,.face,.reopen {min-height:44px;border-radius:8px;font-size:14px}
.refuse {width:100%;position:relative;display:block;padding:0;background:transparent;touch-action:manipulation}
.face {display:grid;place-items:center;color:#fafafa;background:#363636;border:1px solid #f2f2f2;font-weight:500}
.face {width:100%;pointer-events:none}
.accept,.reopen {background:var(--orange);color:#111;font-weight:700;padding:9px 14px}
.accept:hover,.reopen:hover {background:#ff8047}
.particles {position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.controls {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 1px;color:#c4c0bd;font-size:14px}
.replay {display:inline-flex;align-items:center;gap:6px;background:transparent;padding:10px 6px;min-height:44px}
.replay svg {width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
[hidden] {display:none!important}
@media(max-width:370px){label span{gap:3px}.stage{padding-inline:9px}.notice{padding:18px 14px}}
</style>
</head>
<body>
<main>
<h1>粒子动效试玩</h1>
<fieldset><legend class="sr">选择动效</legend>
<label><input type="radio" name="effect" value="dust" checked><span><b>A</b>微尘解体</span></label>
<label><input type="radio" name="effect" value="orbit"><span><b>B</b>向心坍缩</span></label>
<label><input type="radio" name="effect" value="chain"><span><b>C</b>连锁点爆</span></label>
</fieldset>
<section class="stage" aria-label="动效预览">
<div class="notice">
<h2>使用请标明作者：</h2>
<div class="author"><img src="../assets/credit-avatar.jpg" alt=""><div><small>小红书</small><strong>@喝猫撸奶茶</strong></div></div>
<div class="actions">
<div class="refusal-slot"><button class="refuse" type="button"><span class="face">不行！</span></button></div>
<button class="accept" type="button">收到！</button>
</div></div>
<button class="reopen" type="button" hidden>重新打开弹窗</button>
<canvas class="particles" aria-hidden="true"></canvas>
</section>
<div class="controls"><span role="status">点三下「不行！」试试</span><button class="replay" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 9a8 8 0 1 1 0 6M5 3v6h6"/></svg>重玩</button></div>
</main>
<script>
const el = selector => document.querySelector(selector);
const canvas = el('.particles');
const ctx = canvas.getContext('2d');
const stage = el('.stage'), face = el('.face'), refusal = el('.refuse');
const notice = el('.notice'), accept = el('.accept'), reopen = el('.reopen');
const statusLine = el('[role="status"]');
const radios = [...document.querySelectorAll('[name="effect"]')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const tau = Math.PI * 2;
const random = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = palette => palette[Math.floor(Math.random() * palette.length)];
const frost = ['#faf6ed','#dedbd4','#b3b1ad','#ffa676'];
const heat = ['#ff6528','#ffa84d','#ffdda4','#fff6e7'];
let mode, hits, generation = 0, recoil;
let frame = 0;
const particles = [];

function clearParticles() {
  cancelAnimationFrame(frame);
  frame = 0;
  particles.length = 0;
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
}
function sizeCanvas() {
  const ratio = Math.min(devicePixelRatio || 1, 2);
  const width = Math.round(canvas.clientWidth * ratio);
  const height = Math.round(canvas.clientHeight * ratio);
  if (canvas.width === width && canvas.height === height) return;
  clearParticles();
  canvas.width = width;
  canvas.height = height;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
new ResizeObserver(sizeCanvas).observe(stage);
sizeCanvas();

// Every mark is a filled circle. Its path determines the effect.
function addDot(start, life, radius, color, position) {
  particles.push({start, life, radius, color, position});
  if (!frame) frame = requestAnimationFrame(draw);
}
function draw(now) {
  frame = 0;
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  for (let i = particles.length - 1; i >= 0; i--) {
    const dot = particles[i];
    const age = (now - dot.start) / dot.life;
    if (age >= 1) { particles.splice(i, 1); continue; }
    if (age < 0) continue;
    const t = reduce.matches ? .57 : age;
    const [x, y] = dot.position(t);
    const fade = Math.min(1, (1 - age) / .36);
    ctx.globalAlpha = fade;
    ctx.fillStyle = dot.color;
    ctx.beginPath();
    ctx.arc(x, y, dot.radius * (.53 + .47 * fade), 0, tau);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (particles.length) frame = requestAnimationFrame(draw);
}

// Sample the actual outline and label, so the points occupy the lost button's silhouette.
function dust(pos, n, now) {
  const final = n === 3;
  const mask = document.createElement('canvas');
  mask.width = Math.max(1, Math.round(pos.width));
  mask.height = Math.max(1, Math.round(pos.height));
  const ink = mask.getContext('2d', {willReadFrequently:true});
  const w = mask.width, h = mask.height;
  ink.fillStyle = '#424242';
  ink.strokeStyle = '#fff';
  ink.beginPath();
  ink.roundRect(1, 1, w-2, h-2, 7 * pos.scale);
  ink.fill(); ink.stroke();
  ink.fillStyle = '#fff';
  ink.font = '500 ' + (14 * pos.scale) + 'px ' + getComputedStyle(face).fontFamily;
  ink.textAlign = 'center'; ink.textBaseline = 'middle';
  ink.fillText(face.textContent.trim(), w/2, h/2);
  const pixels = ink.getImageData(0, 0, w, h).data;
  const stride = final ? 2 : 3;
  for (let y=1; y<h; y+=stride) {
    for (let x=1; x<w; x+=stride) {
      const offset=(y*w+x)*4;
      if (pixels[offset+3]<45 || (!final && x < w*(n === 1 ? .77 : .62))) continue;
      const bright = pixels[offset]>140;
      if (!bright && Math.random() > .30) continue;
      const x0=pos.x+x-w/2, y0=pos.y+y-h/2;
      const dx=random(12,final?106:34);
      const dy=(y/h-.5)*random(14,final?82:27)-random(7,final?50:16);
      const curl=random(-13,13)*(final?1:.35);
      const delay=(1-x/w)*(final?95:34);
      addDot(now+delay,random(300,final?780:445),bright?random(.95,1.7):random(.75,1.35),
        bright?pick(frost):(Math.random()<.2?'#f79568':'#b0aba6'), t=>{
          const travel=1-Math.pow(1-t,2);
          return [x0+dx*travel+curl*Math.sin(t*Math.PI),y0+dy*travel+14*t*t];
        });
    }
  }
}
function orbit(pos, n, now) {
  const final = n===3, count = final?104:12+n*4;
  const hold = final ? .31 : .38;
  for (let i=0;i<count;i++) {
    const angle=(i+Math.random())*tau/count;
    const from=random(final?23:11,final?56:24);
    const distance=random(final?38:12,final?107:29);
    const spin=random(.55,1.2);
    const radius=random(.9,final?2.55:1.8);
    addDot(now+random(0,18),random(final?600:255,final?760:350),radius,pick(heat),t=>{
      let r, a;
      if(t<hold) {
        const u=t/hold;
        r=2+(from-2)*(1-u*u); a=angle+spin*u;
      } else {
        const u=(t-hold)/(1-hold);
        r=2+distance*(1-Math.pow(1-u,2.5)); a=angle+spin+.18*u;
      }
      return [pos.x+Math.cos(a)*r,pos.y+Math.sin(a)*r*.81];
    });
  }
}
function chain(pos,n,now) {
  const final=n===3, seeds=final?6:(n===1?1:2);
  for(let i=0;i<seeds;i++) {
    const angle=-Math.PI*.7 + (i+random(-.2,.2))*tau/seeds;
    const distance=final?random(35,68):random(11,21);
    const dx=Math.cos(angle)*distance, dy=Math.sin(angle)*distance*.76-5;
    const flight=random(95,final?220:140), launch=now+i*(final?13:8);
    const endX=pos.x+dx, endY=pos.y+dy;
    addDot(launch,flight,final?2.7:1.7,'#fff9e7',t=>
      [pos.x+dx*t,pos.y+dy*t-Math.sin(t*Math.PI)*7]);
    const count=final?18:7;
    for(let j=0;j<count;j++) {
      const dir=(j+Math.random())*tau/count, speed=random(final?12:5,final?39:13);
      const fall=random(12,final?35:18);
      addDot(launch+flight,random(310,final?610:400),random(.85,final?2.2:1.6),pick(heat),t=>{
        const r=speed*(1-Math.pow(1-t,2.2));
        return [endX+Math.cos(dir)*r,endY+Math.sin(dir)*r+fall*t*t];
      });
    }
  }
}
const emit = {dust, orbit, chain};
function reset() {
  generation++; recoil?.cancel(); clearParticles();
  hits=0;refusal.disabled=false;face.style.transform='none';face.style.opacity='1';
  notice.hidden=false;reopen.hidden=true;statusLine.textContent='点三下「不行！」试试';
}
async function hit() {
  if (hits>=3 || notice.hidden) return;
  const n=++hits, final=n===3, token=generation;
  const buttonBox=refusal.getBoundingClientRect(), stageBox=stage.getBoundingClientRect();
  const base=1-.2*(n-1);
  const pos={x:buttonBox.left+buttonBox.width/2-stageBox.left,y:buttonBox.top+buttonBox.height/2-stageBox.top,
    width:buttonBox.width*base,height:buttonBox.height*base,scale:base};
  const current=getComputedStyle(face).transform;
  recoil?.cancel();
  if(final) {
    if(document.activeElement===refusal) accept.focus({preventScroll:true});
    refusal.disabled=true;
  }
  statusLine.textContent=n+' / 3'+(final?' · 可点「重玩」':'');
  const target=final?0:base-.2;
  const resting='scale('+target+')';
  face.style.transform=resting;
  if(!reduce.matches && !final) emit[mode](pos,n,performance.now());
  if(!reduce.matches) {
    const impact='scale('+base*.94+','+base*.78+')';
    const rebound='scale('+target*1.04+','+target*1.07+')';
    const frames=[{transform:current},{transform:impact,offset:.16},{transform:impact,offset:.37},
      {transform:final?'scale('+base+')':rebound,offset:.78},{transform:final?'scale('+base+')':resting}];
    recoil=face.animate(frames,{duration:final?96:185});
    try {await recoil.finished;} catch {return;}
  }
  if(final && token===generation && !notice.hidden) {
    face.style.opacity='0';
    emit[mode](pos,n,performance.now());
  }
}
refusal.addEventListener('click',hit);
accept.addEventListener('click',()=>{
  reset();notice.hidden=true;reopen.hidden=false;statusLine.textContent='弹窗已关闭';reopen.focus({preventScroll:true});
});
reopen.addEventListener('click',()=>{reset();refusal.focus({preventScroll:true});});
el('.replay').addEventListener('click',reset);
function choose(value) {
  const radio=radios.find(input=>input.value===value)||radios[0];
  radio.checked=true;mode=radio.value;reset();
}
radios.forEach(input=>input.addEventListener('change',()=>{choose(input.value);history.replaceState(null,'','#'+mode);}));
window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));
choose(location.hash.slice(1));
</script>
</body>
</html>
